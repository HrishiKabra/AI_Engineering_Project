[project]
name = "f1-rule-interpreter-api"
version = "2.0.0"
description = "Agentic RAG over FIA regulations and steward decisions"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # line length handled by formatter; B008 = FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-q"
