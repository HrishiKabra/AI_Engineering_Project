# Per-IP rate limit for the OpenAI-backed endpoint (defense against abuse/cost).
# Valid here because conf.d/*.conf is included in nginx's http context.
limit_req_zone $binary_remote_addr zone=ask_limit:10m rate=20r/m;

server {
    listen 3000;
    server_name _;

    # Behind the Caddy TLS proxy: use the real client IP (from X-Forwarded-For) for
    # rate limiting. Safe because nginx is only reachable via Caddy on the internal
    # network. In dev (no proxy) there's no XFF header, so $remote_addr is used.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The agent endpoint: rate-limited per IP (burst absorbs short bursts).
    location = /ask {
        limit_req zone=ask_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;            # required for SSE streaming
        proxy_read_timeout 120s;
        chunked_transfer_encoding off;
    }

    # Read-only API surface + Swagger (no rate limit needed).
    location ~ ^/(metrics|health|dashboard|docs|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding off;
    }
}
